name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

concurrency:
  group: strafe-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install native build dependencies
        run: sudo sh packaging/linux/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Build release binary
        run: cargo build --release --locked --no-default-features
      - name: Package Linux archive
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          NAME="strafe-${TAG}-linux-x86_64"
          ROOT="release/${NAME}"
          mkdir -p "${ROOT}/icons/hicolor"
          cp target/release/strafe "${ROOT}/strafe"
          cp packaging/linux/strafe.desktop "${ROOT}/strafe.desktop"
          for size in 16 22 24 32 48 64 128 256 512 1024; do
            mkdir -p "${ROOT}/icons/hicolor/${size}x${size}/apps"
            cp "packaging/linux/hicolor/${size}x${size}/apps/serein.png" \
              "${ROOT}/icons/hicolor/${size}x${size}/apps/strafe.png"
          done
          mkdir -p "${ROOT}/icons/hicolor/scalable/apps"
          cp assets/brand/serein.svg "${ROOT}/icons/hicolor/scalable/apps/strafe.svg"
          cp packaging/linux/install-release.sh "${ROOT}/install.sh"
          chmod +x "${ROOT}/install.sh"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "${ROOT}/"
          tar -C release -czf "release/${NAME}.tar.gz" "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --no-default-features
      - name: Package Windows archive
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $name = "strafe-$tag-windows-x64"
          New-Item -ItemType Directory -Force "release/$name" | Out-Null
          Copy-Item "target/release/strafe.exe" "release/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md "release/$name/"
          Copy-Item "packaging/windows/install-notifications.ps1" "release/$name/"
          Copy-Item "packaging/windows/strafe-portable.cmd" "release/$name/"
          Compress-Archive -Path "release/$name/*" -DestinationPath "release/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Strafe ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
